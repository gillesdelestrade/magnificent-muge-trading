# Profils de frais des plateformes — modifiable à la main ou depuis l'onglet Paramétrage.
#
# Pour chaque tranche :  frais = min(maximum, max(minimum, fixe + pourcentage × montant))
#   jusqu_a     : montant maximum de l'ordre pour cette tranche (inclus) ; absent = sans plafond
#   fixe        : en euros
#   pourcentage : en % du montant (0.09 signifie 0,09 %)
#   minimum / maximum : en euros (absent = pas de limite)
# account_type : CTO ou PEA (en PEA, frais plafonnés à 0,5 % du montant de l'ordre).
# Valeurs relevées sur des comparatifs : À REVÉRIFIER sur les grilles officielles avant usage.
profiles:
