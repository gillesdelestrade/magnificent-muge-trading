[project]
name = "mugetrading"
version = "0.1.0"
description = "Magnificent Muge Trading — simulateur de stratégies boursières (backtest)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=14",
    "yfinance>=0.2.50",
    "streamlit>=1.40",
    "plotly>=5.20",
    "pyyaml>=6",
    "python-dotenv>=1",
    "anthropic>=2.8.0",
    "pydantic>=2.14.3",
    "scipy>=1.17.1",
    "requests>=2.34.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mugetrading"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
